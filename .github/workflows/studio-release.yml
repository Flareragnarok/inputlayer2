name: Input Layer release

# Every push to the studio branch builds a debug APK and publishes it as the
# GitHub release "build-N" (N = highest existing build + 1, shared with
# studio-restore.yml), which the in-app updater (Settings -> Studio -> Check
# for updates) and Obtainium pick up.

on:
  workflow_dispatch:
  push:
    branches:
      - studio

permissions:
  contents: write

concurrency:
  group: studio-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      STUDIO_UPDATE_REPO: ${{ github.repository }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0

    - name: Next build number
      run: |
        last=$(git tag --list 'build-*' | sed 's/^build-//' | sort -n | tail -n1)
        echo "STUDIO_BUILD=$(( ${last:-0} + 1 ))" >> "$GITHUB_ENV"

    # Without the same key every build, Android refuses to install updates
    # over the previous build. See CONTRIBUTING.md for creating the secret.
    - name: Restore debug keystore
      env:
        DEBUG_KEYSTORE_ASC: ${{ secrets.DEBUG_KEYSTORE }}
      run: |
        if [[ -z "$DEBUG_KEYSTORE_ASC" ]]; then
          echo "::error::Secret DEBUG_KEYSTORE is not set; refusing to publish a build signed with a throw-away key."
          exit 1
        fi
        printf '%s\n' "$DEBUG_KEYSTORE_ASC" > debug.keystore.asc
        gpg -d --passphrase "debug0" --batch debug.keystore.asc > debug.keystore

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Test and build
      run: |
        set -o pipefail
        ./gradlew test assembleDebug 2>&1 | tee gradle.log
      env:
        DEBUG_KEYSTORE: "debug.keystore"
        DEBUG_KEYSTORE_PASSWORD: debug0
        DEBUG_KEY_ALIAS: debug
        DEBUG_KEY_PASSWORD: debug0

    # The job log isn't always reachable from the build VM; annotations are
    # (check-runs API), so failures are summarised there.
    - name: Summarise failure
      if: failure()
      run: |
        for f in build/test-results/*/*.xml; do
          [ -f "$f" ] || continue
          grep -o '<testcase name="[^"]*" classname="[^"]*"[^>]*>[[:space:]]*<failure message="[^"]*"' "$f" \
            | sed -E 's/.*name="([^"]*)" classname="([^"]*)".*message="([^"]*)"/::error title=Test failed::\2.\1: \3/' | head -n 5
        done
        if [ -f gradle.log ]; then
          grep -E 'What went wrong|FAILED|error:|Could not|Exception' gradle.log | head -n 8 \
            | sed 's/^/::error title=Gradle::/'
        fi

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="build-${STUDIO_BUILD}"
        apk="input-layer-${tag}.apk"
        cp build/outputs/apk/debug/*.apk "$apk"
        # Notes: the commits since the closest earlier build on this branch
        # (not a restore of an older commit).
        prev=$(git describe --tags --match 'build-*' --abbrev=0 HEAD 2>/dev/null || true)
        range=${prev:+$prev..}HEAD
        { echo "Changes:"; git log --no-merges --format='- %s' "$range" | head -n 50; } > notes.md
        gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
          --title "Input Layer build ${STUDIO_BUILD}" --notes-file notes.md
